<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
  <title id="title">ADAS distance estimation methods visualization</title>
  <desc id="desc">Visual summary of monocular object distance, traffic-light distance, in-path gating, lane pixel distances, and ego-speed scale used in the ADAS project.</desc>
  <defs>
    <style>
      .bg { fill: #f6f8fb; }
      .panel { fill: #ffffff; stroke: #c7d0da; stroke-width: 2; rx: 8; }
      .panel-title { font: 700 28px Arial, sans-serif; fill: #17212b; }
      .small-title { font: 700 21px Arial, sans-serif; fill: #17212b; }
      .text { font: 18px Arial, sans-serif; fill: #24313f; }
      .small { font: 15px Arial, sans-serif; fill: #4c5b68; }
      .formula { font: 700 19px Arial, sans-serif; fill: #0f4c81; }
      .code { font: 15px Consolas, monospace; fill: #5a3b00; }
      .muted { fill: #d8e2ec; stroke: #a9b7c6; stroke-width: 2; }
      .road { fill: #343b44; }
      .lane { fill: none; stroke: #f5d547; stroke-width: 5; }
      .centerline { fill: none; stroke: #f45b69; stroke-width: 4; stroke-dasharray: 10 8; }
      .box { fill: none; stroke: #00a878; stroke-width: 4; }
      .box-warn { fill: none; stroke: #f45b69; stroke-width: 4; }
      .arrow { stroke: #0f4c81; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
      .arrow-soft { stroke: #697a8a; stroke-width: 3; fill: none; marker-end: url(#arrowhead-soft); }
      .flow { stroke: #2f80ed; stroke-width: 4; fill: none; marker-end: url(#arrowhead-blue); }
      .axis { stroke: #1b2633; stroke-width: 3; fill: none; }
      .horizon { stroke: #9b5de5; stroke-width: 3; stroke-dasharray: 12 8; }
      .good { fill: #e9f8f1; stroke: #00a878; stroke-width: 2; rx: 6; }
      .warn { fill: #fff3e0; stroke: #f29f05; stroke-width: 2; rx: 6; }
      .note { fill: #eef4ff; stroke: #7aa7f7; stroke-width: 2; rx: 6; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#0f4c81"/>
    </marker>
    <marker id="arrowhead-soft" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#697a8a"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f80ed"/>
    </marker>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#636b75"/>
      <stop offset="1" stop-color="#262c34"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1600" height="1180"/>
  <text x="54" y="58" class="panel-title">Mô phỏng các cách tính khoảng cách trong dự án ADAS</text>
  <text x="54" y="88" class="text">Các giá trị mét hiện là monocular heuristic / prototype scale, không phải đo sâu đã hiệu chuẩn.</text>

  <!-- Panel 1 -->
  <rect class="panel" x="40" y="125" width="500" height="310"/>
  <text x="70" y="166" class="small-title">1. Vật thể đường bộ: bbox-height</text>
  <rect x="85" y="205" width="190" height="165" fill="url(#roadGrad)" rx="5"/>
  <path class="lane" d="M128 365 C146 305, 158 245, 170 205"/>
  <path class="lane" d="M232 365 C218 305, 204 245, 190 205"/>
  <rect class="box" x="145" y="246" width="70" height="82"/>
  <rect x="158" y="279" width="44" height="28" fill="#5aa9e6" stroke="#16324f" stroke-width="2"/>
  <circle cx="166" cy="312" r="6" fill="#17212b"/>
  <circle cx="194" cy="312" r="6" fill="#17212b"/>
  <line class="arrow-soft" x1="225" y1="246" x2="225" y2="328"/>
  <text x="235" y="292" class="small">h_bbox</text>
  <path class="axis" d="M180 390 L180 340"/>
  <path class="arrow" d="M180 340 L180 230"/>
  <text x="93" y="397" class="small">camera</text>
  <text x="310" y="214" class="formula">z_size = H_real * f_y / h_bbox</text>
  <text x="310" y="250" class="text">Nguồn chính cho:</text>
  <text x="310" y="278" class="small">car, truck, bus, motorcycle</text>
  <text x="310" y="314" class="text">Sau đó tính ngang:</text>
  <text x="310" y="342" class="formula">x_m = (u - c_x) / f_x * z</text>
  <text x="310" y="375" class="code">object_localizer_depth.py</text>
  <text x="310" y="398" class="code">object_localizer_pose.py</text>

  <!-- Panel 2 -->
  <rect class="panel" x="550" y="125" width="500" height="310"/>
  <text x="580" y="166" class="small-title">2. Bottom cap: vật thể chạm đáy ảnh</text>
  <rect x="592" y="200" width="210" height="170" fill="url(#roadGrad)" rx="5"/>
  <path class="lane" d="M640 370 C655 315, 670 250, 680 200"/>
  <path class="lane" d="M755 370 C735 315, 718 250, 700 200"/>
  <rect class="box-warn" x="655" y="282" width="86" height="88"/>
  <rect x="672" y="314" width="52" height="32" fill="#ffb703" stroke="#4d2c00" stroke-width="2"/>
  <circle cx="682" cy="352" r="7" fill="#17212b"/>
  <circle cx="714" cy="352" r="7" fill="#17212b"/>
  <line x1="592" y1="370" x2="802" y2="370" stroke="#f45b69" stroke-width="4"/>
  <text x="612" y="394" class="small">bbox bị cắt bởi đáy frame</text>
  <text x="835" y="215" class="formula">bottom_ratio = y2 / frame_h</text>
  <text x="835" y="250" class="text">Nếu bottom_ratio >= 0.78:</text>
  <text x="835" y="280" class="formula">cap: 8.0m → 0.6m</text>
  <text x="835" y="314" class="formula">z = min(z_size, bottom_cap)</text>
  <rect class="warn" x="832" y="340" width="185" height="55"/>
  <text x="846" y="363" class="small">Mục tiêu: vật thể rất gần</text>
  <text x="846" y="384" class="small">không bị tính xa do bbox thiếu.</text>
  <text x="835" y="418" class="code">depth_estimates()</text>

  <!-- Panel 3 -->
  <rect class="panel" x="1060" y="125" width="500" height="310"/>
  <text x="1090" y="166" class="small-title">3. Đèn giao thông: size + elevation</text>
  <rect x="1100" y="200" width="215" height="170" fill="#dce9f7" rx="5"/>
  <line class="horizon" x1="1100" y1="262" x2="1315" y2="262"/>
  <text x="1112" y="252" class="small">horizon</text>
  <rect class="box" x="1198" y="218" width="28" height="42"/>
  <circle cx="1212" cy="231" r="7" fill="#f45b69"/>
  <circle cx="1212" cy="246" r="7" fill="#00a878"/>
  <line class="arrow" x1="1140" y1="350" x2="1212" y2="239"/>
  <path d="M1160 322 A45 45 0 0 1 1183 293" fill="none" stroke="#0f4c81" stroke-width="3"/>
  <text x="1187" y="308" class="small">theta</text>
  <line x1="1212" y1="239" x2="1212" y2="350" stroke="#697a8a" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1328" y="212" class="formula">z_size = H_light * f_y / h_bbox</text>
  <text x="1328" y="244" class="formula">theta = atan((c_y - v)/f_y) + pitch</text>
  <text x="1328" y="276" class="formula">z_height = (H_mount - H_cam) / tan(theta)</text>
  <text x="1328" y="315" class="text">Nếu ground-anchor hợp lệ:</text>
  <text x="1328" y="343" class="small">distance_m = z_height</text>
  <text x="1328" y="371" class="small">nhiều đèn cùng cụm → median group</text>
  <text x="1328" y="408" class="code">object_localizer_traffic.py</text>

  <!-- Panel 4 -->
  <rect class="panel" x="40" y="460" width="500" height="310"/>
  <text x="70" y="501" class="small-title">4. Tọa độ camera: z_m, x_m, distance_m</text>
  <rect x="95" y="545" width="180" height="165" fill="url(#roadGrad)" rx="5"/>
  <circle cx="185" cy="710" r="8" fill="#f45b69"/>
  <circle cx="238" cy="608" r="8" fill="#00a878"/>
  <line class="arrow" x1="185" y1="710" x2="185" y2="610"/>
  <line class="arrow-soft" x1="185" y1="608" x2="238" y2="608"/>
  <line class="arrow" x1="185" y1="710" x2="238" y2="608"/>
  <text x="150" y="654" class="small">z_m</text>
  <text x="206" y="596" class="small">x_m</text>
  <text x="218" y="665" class="small">distance_m</text>
  <rect class="box" x="214" y="575" width="48" height="58"/>
  <text x="310" y="548" class="formula">distance_m = hypot(x_m, z_m)</text>
  <text x="310" y="585" class="text">Đang đúng cho vật thể đường bộ.</text>
  <rect class="warn" x="308" y="612" width="195" height="70"/>
  <text x="322" y="638" class="small">Lưu ý review:</text>
  <text x="322" y="660" class="small">traffic light hiện dùng distance_m = z</text>
  <text x="322" y="682" class="small">nên contract chưa đồng nhất.</text>
  <text x="310" y="724" class="code">object_localizer_pose.py</text>

  <!-- Panel 5 -->
  <rect class="panel" x="550" y="460" width="500" height="310"/>
  <text x="580" y="501" class="small-title">5. In-path: khoảng cách chỉ được xét trong corridor</text>
  <rect x="595" y="535" width="210" height="175" fill="url(#roadGrad)" rx="5"/>
  <polygon points="680,540 720,540 790,710 605,710" fill="#ffe066" opacity="0.18" stroke="#f5d547" stroke-width="4"/>
  <path class="centerline" d="M700 540 C700 590, 700 650, 700 710"/>
  <rect class="box" x="668" y="620" width="55" height="55"/>
  <rect class="box-warn" x="605" y="585" width="45" height="45"/>
  <circle cx="696" cy="675" r="5" fill="#00a878"/>
  <circle cx="628" cy="630" r="5" fill="#f45b69"/>
  <text x="612" y="732" class="small">bbox/foot trong corridor → in_path=True</text>
  <text x="835" y="548" class="text">Dùng để chọn leading object:</text>
  <text x="835" y="579" class="formula">point_in_corridor()</text>
  <text x="835" y="609" class="formula">bbox_intersects_corridor()</text>
  <text x="835" y="644" class="text">Fallback khi không có polygon:</text>
  <text x="835" y="674" class="formula">center_gate + min_bottom_ratio</text>
  <rect class="note" x="832" y="697" width="188" height="48"/>
  <text x="846" y="718" class="small">Không tạo mét mới, nhưng quyết định</text>
  <text x="846" y="738" class="small">vật thể nào là phía trước xe.</text>
  <text x="835" y="762" class="code">path_relevance.py</text>

  <!-- Panel 6 -->
  <rect class="panel" x="1060" y="460" width="500" height="310"/>
  <text x="1090" y="501" class="small-title">6. Ego speed: optical flow trên lane_area</text>
  <rect x="1100" y="535" width="215" height="175" fill="url(#roadGrad)" rx="5"/>
  <polygon points="1180,540 1238,540 1310,710 1105,710" fill="#00a878" opacity="0.22"/>
  <path class="lane" d="M1140 710 C1160 650, 1172 590, 1184 540"/>
  <path class="lane" d="M1280 710 C1250 650, 1238 590, 1225 540"/>
  <path class="flow" d="M1160 585 L1160 630"/>
  <path class="flow" d="M1205 575 L1205 627"/>
  <path class="flow" d="M1250 590 L1250 638"/>
  <text x="1120" y="732" class="small">median dy từ Farneback flow</text>
  <text x="1330" y="548" class="formula">speed_mps = |median_dy| * fps / 160</text>
  <text x="1330" y="582" class="text">Nguồn scale:</text>
  <text x="1330" y="612" class="small">EGO_SPEED_IMAGE_PX_PER_METER = 160</text>
  <rect class="warn" x="1328" y="638" width="195" height="70"/>
  <text x="1342" y="664" class="small">Prototype image-space scale.</text>
  <text x="1342" y="686" class="small">Không phải khoảng cách vật thể</text>
  <text x="1342" y="708" class="small">và chưa phải calibrated BEV.</text>
  <text x="1330" y="752" class="code">ego_speed_estimator.py</text>

  <!-- Bottom summary strip -->
  <rect class="panel" x="40" y="805" width="1520" height="300"/>
  <text x="70" y="846" class="small-title">Tóm tắt dòng dữ liệu</text>

  <rect class="good" x="80" y="880" width="260" height="95"/>
  <text x="104" y="912" class="small-title">YOLO bbox</text>
  <text x="104" y="942" class="text">box = [x1,y1,x2,y2]</text>
  <text x="104" y="968" class="small">h_bbox, bottom_y, center</text>

  <path class="arrow" d="M350 928 L430 928"/>
  <rect class="good" x="445" y="880" width="300" height="95"/>
  <text x="469" y="912" class="small-title">Depth source</text>
  <text x="469" y="942" class="text">size_height / bottom_cap</text>
  <text x="469" y="968" class="small">traffic_light_size / height / group</text>

  <path class="arrow" d="M755 928 L835 928"/>
  <rect class="good" x="850" y="880" width="280" height="95"/>
  <text x="874" y="912" class="small-title">Pose fields</text>
  <text x="874" y="942" class="text">z_m, x_m, bearing_deg</text>
  <text x="874" y="968" class="small">distance_source + confidence</text>

  <path class="arrow" d="M1140 928 L1220 928"/>
  <rect class="good" x="1235" y="880" width="280" height="95"/>
  <text x="1259" y="912" class="small-title">Consumer</text>
  <text x="1259" y="942" class="text">draw_detections / HUD</text>
  <text x="1259" y="968" class="small">behavior: leading vehicle</text>

  <line x1="80" y1="1018" x2="1515" y2="1018" stroke="#c7d0da" stroke-width="2"/>
  <text x="80" y="1054" class="small-title">Khoảng cách pixel trong lane/tracker</text>
  <text x="80" y="1084" class="text">lane_width_px, edge_distance_px, memory_error_px, expected_from_opposite_error_px đều là pixel-space diagnostics.</text>
  <text x="80" y="1114" class="small">Các giá trị này phục vụ fit/gate lane boundary, không nên hiểu là mét nếu chưa có camera-to-ground calibration/IPM thật.</text>
</svg>
